name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kodlarini Cek
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3

    - name: Sahte google-services.json Olustur
      run: |
        mkdir -p app
        echo '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.htmlappbuilder.app"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json

    - name: APK Derle
      run: gradle assembleDebug --no-daemon -Djava.awt.headless=true

    - name: APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

